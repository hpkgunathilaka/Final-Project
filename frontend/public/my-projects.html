<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>My Posted Projects</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="container header">
      <h1>My Posted Projects</h1>
      <nav class="nav">
        <a href="./index.html">Home</a>
        <a href="./projects.html">All Projects</a>
        <a href="./post-project.html">Post Project</a>
      </nav>
    </header>

    <main class="container">
      <section class="card">
        <div class="row">
          <button id="refreshBtn" type="button">Refresh</button>
          <button id="logoutBtn" type="button" class="secondary">Logout</button>
          <span id="me" class="muted"></span>
        </div>
        <div id="list" class="list"></div>
        <p id="status" class="muted"></p>
      </section>
    </main>

    <script src="./assets/app.js"></script>
    <script>
      (function () {
        const user = auth.getUser();
        if (!user) {
          window.location.href = './login.html';
          return;
        }
        if (user.role !== 'ngo') {
          window.location.href = './projects.html';
          return;
        }

        const token = auth.getToken();
        const list = document.getElementById('list');
        const status = document.getElementById('status');
        const me = document.getElementById('me');
        const refreshBtn = document.getElementById('refreshBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        me.textContent = `Logged in: ${user.email} (${user.role})`;

        function readSkillsInput(raw) {
          return String(raw || '')
            .split(',')
            .map((s) => s.trim())
            .filter(Boolean);
        }

        function renderProjects(projects) {
          if (!projects.length) {
            list.innerHTML = '<p class="muted">You have not posted any projects yet.</p>';
            return;
          }

          list.innerHTML = projects
            .map(
              (p) => `
              <article class="item" data-id="${p._id}">
                <div class="field">
                  <label>Title</label>
                  <input class="edit-title" type="text" value="${escapeHtml(p.title || '')}" />
                </div>
                <div class="field">
                  <label>Description</label>
                  <textarea class="edit-description" rows="4">${escapeHtml(p.description || '')}</textarea>
                </div>
                <div class="field">
                  <label>Skills Needed (comma-separated)</label>
                  <input class="edit-skills" type="text" value="${escapeHtml((p.skillsNeeded || []).join(', '))}" />
                </div>
                <p class="muted">Status: ${escapeHtml(p.status || 'open')}</p>
                <div class="row">
                  <button type="button" class="saveBtn">Save Changes</button>
                  <button type="button" class="deleteBtn secondary">Delete Project</button>
                  <a class="button button-secondary" href="./matches.html?projectId=${encodeURIComponent(p._id)}">Matches</a>
                  <a class="button button-secondary" href="./tasks.html?projectId=${encodeURIComponent(p._id)}">Tasks</a>
                  <a class="button button-secondary" href="./messages.html?projectId=${encodeURIComponent(p._id)}">Messages</a>
                </div>
              </article>
            `
            )
            .join('');
        }

        async function loadMine() {
          status.textContent = 'Loading your projects...';
          try {
            const data = await request('/projects/mine', {
              method: 'GET',
              headers: { Authorization: `Bearer ${token}` }
            });
            renderProjects(data.projects || []);
            status.textContent = '';
          } catch (err) {
            status.textContent = err.message;
          }
        }

        async function saveProject(article) {
          const id = article.getAttribute('data-id');
          const title = article.querySelector('.edit-title').value.trim();
          const description = article.querySelector('.edit-description').value.trim();
          const skillsNeeded = readSkillsInput(article.querySelector('.edit-skills').value);

          if (!title || !description) {
            status.textContent = 'Title and description are required.';
            return;
          }

          status.textContent = 'Saving changes...';
          try {
            await request(`/projects/${encodeURIComponent(id)}`, {
              method: 'PUT',
              body: { title, description, skillsNeeded },
              headers: { Authorization: `Bearer ${token}` }
            });
            status.textContent = 'Project updated.';
            await loadMine();
          } catch (err) {
            status.textContent = err.message;
          }
        }

        async function deleteProject(article) {
          const id = article.getAttribute('data-id');
          const confirmed = window.confirm('Delete this project? This action cannot be undone.');
          if (!confirmed) return;

          status.textContent = 'Deleting project...';
          try {
            await request(`/projects/${encodeURIComponent(id)}`, {
              method: 'DELETE',
              headers: { Authorization: `Bearer ${token}` }
            });
            status.textContent = 'Project deleted.';
            await loadMine();
          } catch (err) {
            status.textContent = err.message;
          }
        }

        refreshBtn.addEventListener('click', loadMine);
        logoutBtn.addEventListener('click', () => {
          logoutCurrentUser();
        });

        list.addEventListener('click', async (e) => {
          const article = e.target.closest('article.item');
          if (!article) return;

          if (e.target.classList.contains('saveBtn')) {
            await saveProject(article);
          }

          if (e.target.classList.contains('deleteBtn')) {
            await deleteProject(article);
          }
        });

        loadMine();
      })();
    </script>
  </body>
</html>
