<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <header class="container header">
      <h1>Login</h1>
      <nav class="nav">
        <a href="./index.html" data-i18n="nav.home">Home</a>
        <a href="./register.html" data-i18n="nav.register">Register</a>
        <a href="./projects.html" data-i18n="nav.projects">Projects</a>
      </nav>
      <div class="row">
        <label for="langSelect" class="muted small" data-i18n="lang.label">Language</label>
        <select id="langSelect" aria-label="Language">
          <option value="en">EN</option>
          <option value="si">SI</option>
          <option value="ta">TA</option>
        </select>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <form id="loginForm" class="form">
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" />
            <div class="error" data-error-for="email"></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
            <div class="error" data-error-for="password"></div>
          </div>
          <button type="submit">Login</button>
        </form>
        <p id="status" class="muted"></p>
      </section>
    </main>

    <script src="./assets/app.js"></script>
    <script>
      initLanguageToggle('langSelect');
    </script>
    <script>
      (function () {
        const form = document.getElementById('loginForm');
        const status = document.getElementById('status');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          ui.clearErrors(form);
          status.textContent = '';

          const email = form.email.value.trim();
          const password = form.password.value;

          const errors = {};
          if (!email) errors.email = 'Email is required.';
          else if (!validation.isEmail(email)) errors.email = 'Enter a valid email address.';
          if (!password) errors.password = 'Password is required.';

          if (Object.keys(errors).length) {
            ui.showErrors(form, errors);
            status.textContent = 'Please fix the highlighted fields.';
            return;
          }

          status.textContent = 'Logging in...';

          const body = {
            email,
            password
          };

          try {
            const data = await api.post('/auth/login', body);
            if (data?.user?.role === 'admin') {
              auth.clearSession();
              status.textContent = 'Admin accounts must use the dedicated admin login page.';
              return;
            }
            auth.saveSession(data);
            if (typeof syncAuthNavigation === 'function') syncAuthNavigation();
            if (typeof injectGlobalLogoutButton === 'function') injectGlobalLogoutButton();
            status.textContent = `Logged in as ${data.user.role}.`;
            window.location.href = data.user.role === 'ngo' ? './my-projects.html' : './projects.html';
          } catch (err) {
            status.textContent = err.message;
          }
        });
      })();
    </script>
  </body>
</html>
